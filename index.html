<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E5CF">
  <meta name="description" content="猫の両手で、ぜんぶお片付け。6個の物を運ぶ、小さなタイムアタックゲーム。">
  <title>猫の手も借りたい</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>

  <style>
    .otg-back-link {
      position: fixed;
      z-index: 9999;
      left: max(10px, env(safe-area-inset-left));
      bottom: max(10px, env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 11px;
      color: #3f382e;
      background: rgba(255, 250, 240, 0.92);
      border: 2px solid #3f382e;
      border-radius: 999px;
      box-shadow: 3px 3px 0 rgba(63, 56, 46, 0.9);
      font: 800 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .otg-back-link:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 rgba(63, 56, 46, 0.9);
    }
  </style>
</head>
<body>
  <a class="otg-back-link" href="https://ryg4mk.github.io/one-take-game/" aria-label="ONE TAKE GAME一覧へ戻る">
    <span aria-hidden="true">←</span>
    <span>ONE TAKE GAME</span>
  </a>

  <main id="game" aria-label="猫の手も借りたい">
    <canvas id="canvas" width="360" height="640" tabindex="0" aria-label="猫の手も借りたい ゲーム画面" aria-describedby="instructions">Canvasに対応したブラウザで遊んでください。</canvas>
    <button id="action" type="button" aria-label="スタート">スタート</button>
    <p id="instructions" class="sr-only">画面をドラッグして猫の両手を動かします。手は指の60ピクセル上にあります。手の間で物をつかみ、缶と紙は左のゴミ箱、靴下とタオルは中央の洗濯カゴ、ボールとねずみは右のおもちゃ箱へ運びます。指を離しても物は保持されます。キーボードでは矢印キーでも移動できます。</p>
    <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript>遊ぶにはブラウザのJavaScriptを有効にしてください。</noscript>

  <script data-otg-visit-counter>
    (() => {
      const gameId = '001';
      const isPublished = location.hostname === 'ryg4mk.github.io';
      if (!isPublished) return;

      const sessionKey = 'otg-game-visit-' + gameId;
      try {
        if (sessionStorage.getItem(sessionKey) === '1') return;
        sessionStorage.setItem(sessionKey, '1');
      } catch {}

      const key = 'one_take_' + gameId + '_views_bkg_otg_20261008_v1';
      fetch('https://countapi.mileshilliard.com/api/v1/hit/' + encodeURIComponent(key), {
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    })();
  </script>
</body>
</html>
