<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E5CF">
  <meta name="description" content="猫の両手で、ぜんぶお片付け。6個の物を運ぶ、小さなタイムアタックゲーム。">
  <title>猫の手も借りたい</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>

  <main id="game" aria-label="猫の手も借りたい">
    <canvas id="canvas" width="360" height="640" tabindex="0" aria-label="猫の手も借りたい ゲーム画面" aria-describedby="instructions">Canvasに対応したブラウザで遊んでください。</canvas>
    <button id="action" type="button" aria-label="スタート">スタート</button>
    <p id="instructions" class="sr-only">画面をドラッグして猫の両手を動かします。手は指の60ピクセル上にあります。手の間で物をつかみ、缶と紙は左のゴミ箱、靴下とタオルは中央の洗濯カゴ、ボールとねずみは右のおもちゃ箱へ運びます。指を離しても物は保持されます。キーボードでは矢印キーでも移動できます。</p>
    <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript>遊ぶにはブラウザのJavaScriptを有効にしてください。</noscript>

  <script data-otg-visit-counter>
    (() => {
      if (window.top !== window.self) return;
      if (location.hostname !== 'ryg4mk.github.io') return;

      const gameId = '001';
      const key = 'one_take_' + gameId + '_views_bkg_otg_views_20261008_v2';

      fetch('https://countapi.mileshilliard.com/api/v1/hit/' + encodeURIComponent(key), {
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    })();
  </script>
</body>
</html>
